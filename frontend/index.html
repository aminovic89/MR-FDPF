<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MR-FDPF — Simulateur de propagation indoor</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>MR-FDPF — Propagation radio indoor</h1>
  </header>
  <div class="layout">
    <aside class="panel">
      <section>
        <h2>Domaine</h2>
        <label>Largeur (m) <input id="domain-width" type="number" value="8" min="1" step="0.5"></label>
        <label>Hauteur (m) <input id="domain-height" type="number" value="6" min="1" step="0.5"></label>
      </section>
      <section>
        <h2>Étages</h2>
        <div id="floor-tabs" class="floor-tabs"></div>
        <div class="tool-buttons">
          <button id="add-floor-btn" class="secondary">+ Étage</button>
          <button id="remove-floor-btn" class="secondary">− Étage</button>
        </div>
        <label>Atténuation inter-étage (dB) <input id="floor-attenuation" type="number" value="15" step="1" min="0"></label>
      </section>
      <section>
        <h2>Outils (étage courant)</h2>
        <div class="tool-buttons">
          <button data-tool="wall" class="active">Mur</button>
          <button data-tool="source">Source</button>
          <button data-tool="erase">Effacer</button>
        </div>
        <label>Matériau <select id="material-select"></select></label>
        <label>Puissance source (dBm) <input id="source-power" type="number" value="20" step="1"></label>
        <button id="clear-btn" class="secondary">Vider l'étage courant</button>
      </section>
      <section>
        <h2>Simulation</h2>
        <label>Fréquence (MHz) <input id="freq-mhz" type="number" value="2400" step="100"></label>
        <label>Résolution (pts/longueur d'onde) <input id="ppw" type="number" value="8" min="4" max="30"></label>
        <label>Solveur
          <select id="mode-select">
            <option value="single">Mono-résolution (direct)</option>
            <option value="multi">Multi-résolution (sous-structuration)</option>
          </select>
        </label>
        <button id="simulate-btn">Simuler</button>
        <p id="status" class="status"></p>
      </section>
      <section>
        <h2>Fichier</h2>
        <button id="export-scene-btn" class="secondary">Exporter le bâtiment (JSON)</button>
        <button id="import-scene-btn" class="secondary">Importer un bâtiment</button>
        <input id="import-scene-input" type="file" accept="application/json" hidden>
        <button id="export-image-btn" class="secondary">Exporter l'étage affiché (PNG)</button>
      </section>
    </aside>
    <main class="canvas-wrap">
      <canvas id="scene-canvas"></canvas>
      <canvas id="legend-canvas" width="300" height="34"></canvas>
    </main>
  </div>
</div>
<script>
  window.addEventListener('error', (e) => console.error('GLOBAL ERROR', e.message, e.filename, e.lineno, e.colno));
  window.addEventListener('unhandledrejection', (e) => console.error('REJECTION', e.reason && e.reason.message, e.reason && e.reason.stack));
</script>
<script type="module" src="/static/src/main.js?v=3"></script>
</body>
</html>
